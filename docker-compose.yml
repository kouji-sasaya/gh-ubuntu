services:
  dev_env:
    image: gh-ubuntu:latest
    build:
      context: .
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
    environment:
      - LOCAL_UID=${LOCAL_UID:-1000}
      - LOCAL_GID=${LOCAL_GID:-1000}
      - UBUNTU_VERSION=${UBUNTU_VERSION:-24.04}
    volumes:
      - ${PWD:-.}:/workdir
    working_dir: /workdir